name: Build J Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract J Launcher project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project

          ZIP="./JLauncher-0.3.0-project-LENGKAP.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "J Launcher ZIP tidak ditemukan."
            exit 1
          fi

          unzip -q "$ZIP" -d project

          SETTINGS="$(find project -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J-Launcher-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
